# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Check against live CRAN rather than renv.lock
      RENV_CONFIG_AUTOLOADER_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN serves its macOS binaries zstd-compressed. pak recognises only
      # gzip, zip, bzip2 and xz, so it aborts on them with "unknown archive
      # type" (r-lib/pkgdepends#485). P3M rebuilds the same packages with gzip.
      # Remove this once pkgdepends handles zstd. (use-public-rspm on setup-r
      # above only redirects Linux.)
      - name: Install macOS binaries from P3M rather than CRAN
        if: runner.os == 'macOS'
        run: echo "PKG_CRAN_MIRROR=https://packagemanager.posit.co/cran/latest" >> $GITHUB_ENV

      # njoaguof is GitHub-only; setup-r-dependencies resolves it from the
      # Remotes: field in DESCRIPTION.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
